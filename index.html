<!doctype html>
<html lang="en">
  <head>
    <title>Todo App</title>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" media="screen" />
  </head>
  <body>
    <header class="page-header">
      <h1 class="visually-hidden">Todo App</h1>
      <img
        class="page-header__image"
        src="./eisenhower-matrix.jpg"
        alt="Eisenhower Matrix"
      />
      <a
        class="page-header__link"
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details&quest;
      </a>
    </header>
    <main class="todo-app">
      <div class="add-task">
        <label for="new-task">Add Item</label>
        <div class="add-task__row">
          <input id="new-task" class="add-task__input" type="text" />
          <button class="add-task__button">Add</button>
        </div>
      </div>
      <section>
        <h2>Todo</h2>
        <ul id="todo-list">
          <li class="task-item">
            <input class="task-item__checkbox" type="checkbox" />
            <label class="task-item__label">Pay Bills</label>
            <input class="task-item__edit-input" type="text" />
            <button class="task-item__edit-button">Edit</button>
            <button class="task-item__delete-button">
              <img src="./remove.svg" alt="" />
            </button>
          </li>
          <li class="task-item task-item--editing">
            <input class="task-item__checkbox" type="checkbox" />
            <label class="task-item__label">Go Shopping</label>
            <input
              class="task-item__edit-input"
              type="text"
              value="Go Shopping"
            />
            <button class="task-item__edit-button">Save</button>
            <button class="task-item__delete-button">
              <img src="./remove.svg" alt="" />
            </button>
          </li>
        </ul>
      </section>
      <section>
        <h2>Completed</h2>
        <ul id="completed-list">
          <li class="task-item">
            <input class="task-item__checkbox" type="checkbox" checked />
            <label class="task-item__label">See the Doctor</label>
            <input class="task-item__edit-input" type="text" />
            <button class="task-item__edit-button">Edit</button>
            <button class="task-item__delete-button">
              <img src="./remove.svg" alt="" />
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
