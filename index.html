<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" media="screen" />
  </head>
  <body>
    <header class="page-header">
      <h1 class="visually-hidden">Todo App</h1>
      <img
        class="page-header__image"
        src="./eisenhower-matrix.jpg"
        alt="Eisenhower Matrix"
      />
      <a
        class="page-header__link"
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details&quest;
      </a>
    </header>
    <main class="todo-app">
      <div class="add-task">
        <label for="new-task">Add Item</label>
        <div class="add-task__row">
          <input id="new-task" class="add-task__input" type="text" />
          <button class="add-task__button" type="button">Add</button>
        </div>
      </div>
      <section>
        <h2>Todo</h2>
        <ul id="todo-list"></ul>
      </section>
      <section>
        <h2>Completed</h2>
        <ul id="completed-list"></ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
